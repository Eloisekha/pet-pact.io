<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Pact Login</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f3f1; /* white-ish background */
        --ink: #1f1f1f; /* black */
        --accent: #f3b03b; /* yellow accent */
        --cream: #ede3be; /* soft surface */
        --cream-rgb: rgba(237, 227, 190, 0.466);
      }

      @font-face {
        font-family: "BP Child Fatty";
        src: url("./fonts/bpchildfatty.regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "DynaPuff", system-ui, sans-serif;
        font-weight: 400;
      }

      body {
        background-color: var(--cream); /* whole page background */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      /* Phone frame */
      .phone-frame {
        width: 320px;
        height: 640px;
        background-color: var(--ink);
        border-radius: 36px;
        padding: 10px;
        position: relative;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      }

      .phone-notch {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 130px;
        height: 22px;
        background-color: var(--ink);
        border-bottom-left-radius: 18px;
        border-bottom-right-radius: 18px;
        z-index: 10;
      }

      /* Screen */
      .app-screen {
        width: 100%;
        height: 100%;
        background-color: var(--bg);
        border-radius: 28px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 30px 24px;
        position: relative;
      }

      /* Logo */
      .logo-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 32px;
      }
      .logo-circle {
        width: auto;
        height: auto;
        background-color: transparent;
        border-radius: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 16px;
        border: none;
        box-shadow: none;
      }

      .pulse {
        animation: pulse 2.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
        100% {
          transform: scale(1);
        }
      }
      .login-logo-img {
        width: 100px;
        height: 100px;
        object-fit: contain;
        display: block;
        border-radius: 0;
      }

      .app-title {
        font-family: "BP Child Fatty", "Nunito", sans-serif;
        font-size: 28px;
        font-weight: 400;
        color: var(--ink);
        letter-spacing: 1px;
      }

      /* Form */
      form {
        width: 100%;
      }

      label {
        font-size: 12px;
        font-weight: 800;
        color: rgba(31, 31, 31, 0.8);
        margin-bottom: 6px;
        display: block;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .input-group {
        position: relative;
        margin-bottom: 16px;
        background-color: var(--cream-rgb);
        border-radius: 14px;
        display: flex;
        align-items: center;
        padding: 6px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        border: 2px solid rgba(31, 31, 31, 0.08);
      }

      .input-icon {
        width: 18px;
        height: 18px;
        color: rgba(31, 31, 31, 0.55);
        margin-left: 10px;
      }

      input {
        width: 100%;
        border: none;
        background: transparent;
        padding: 10px;
        font-size: 15px;
        color: var(--ink);
        outline: none;
        font-weight: 700;
      }

      input::placeholder {
        color: rgba(31, 31, 31, 0.45);
        font-weight: 600;
      }

      /* Toggle eye */
      .toggle-password {
        cursor: pointer;
        padding: 5px 8px;
        display: flex;
        align-items: center;
      }

      .toggle-password svg {
        width: 18px;
        height: 18px;
        stroke: rgba(31, 31, 31, 0.55);
        fill: none;
        stroke-width: 2;
      }

      /* Options row */
      .options-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 22px;
        font-size: 12px;
        color: rgba(31, 31, 31, 0.75);
      }

      .checkbox-container {
        display: flex;
        align-items: center;
        cursor: pointer;
      }

      .checkbox-container input {
        width: auto;
        margin-right: 8px;
        accent-color: var(--accent); /* yellow */
      }

      .forgot-link {
        text-decoration: none;
        color: rgba(31, 31, 31, 0.85);
        font-weight: 800;
      }

      .forgot-link:hover {
        text-decoration: underline;
      }

      /* Buttons */
      .button-row {
        display: flex;
        gap: 10px;
      }

      .btn {
        flex: 1;
        padding: 12px 0;
        border: none;
        border-radius: 14px;
        font-size: 13px;
        font-weight: 900;
        cursor: pointer;
        transition: transform 0.1s;
        box-shadow: 0 6px 10px rgba(0, 0, 0, 0.1);
      }

      .btn:active {
        transform: scale(0.98);
      }

      /* Sign Up = yellow accent */
      .btn-create {
        background-color: var(--accent);
        color: var(--ink);
      }

      /* Log In = ink */
      .btn-login {
        background-color: var(--ink);
        color: var(--bg);
      }

      /* Focus ring */
      .btn:focus,
      input:focus {
        outline: none;
      }

      .input-group:focus-within {
        border-color: rgba(243, 176, 59, 0.85);
        box-shadow: 0 0 0 4px rgba(243, 176, 59, 0.2);
      }
    </style>
  </head>

  <body>
    <div class="phone-frame">
      <div class="phone-notch"></div>

      <div class="app-screen">
        <div class="logo-section">
          <div class="logo-circle pulse">
            <img class="login-logo-img" src="icon.png" alt="PetPact icon" />
          </div>

          <h1 class="app-title">pet pact</h1>
        </div>

        <form id="loginForm">
          <label>USERNAME</label>
          <div class="input-group">
            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" placeholder="Enter username" />
          </div>

          <label>PASSWORD</label>
          <div class="input-group">
            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>

            <input type="password" id="password" placeholder="Enter password" />

            <div
              class="toggle-password"
              id="togglePassword"
              aria-label="Toggle password visibility"
              role="button"
              tabindex="0"
            >
              <svg
                viewBox="0 0 24 24"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </div>
          </div>

          <div class="options-row">
            <label class="checkbox-container">
              <input type="checkbox" /> Remember Me
            </label>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>

          <div class="button-row">
            <button type="button" class="btn btn-create">Sign Up</button>
            <button type="submit" class="btn btn-login">Log In</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const toggleBtn = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");

        const toggle = () => {
          const type =
            passwordInput.getAttribute("type") === "password"
              ? "text"
              : "password";
          passwordInput.setAttribute("type", type);
          toggleBtn.style.opacity = type === "text" ? "0.6" : "1";
        };

        toggleBtn.addEventListener("click", toggle);
        toggleBtn.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });
        const loginForm = document.getElementById("loginForm");
        loginForm.addEventListener("submit", (e) => {
          e.preventDefault();
          console.log("Logging in...");
          window.location.href = "screen2.html";
        });
      });
    </script>
  </body>
</html>
