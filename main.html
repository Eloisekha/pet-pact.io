<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Pact - Timer</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- THEME VARIABLES --- */
      :root {
        --bg: #f4f3f1;
        --ink: #1f1f1f;
        --accent: #f3b03b;
        --cream: #ede3be;
        --cream-rgb: 237, 227, 190;
        --danger: #f3543b;

        /* --- FONT WEIGHT SCALE --- */
        --w-regular: 400;
        --w-medium: 500;
        --w-semibold: 600;
        --w-bold: 700;
        --w-black: 900;
      }

      @font-face {
        font-family: "BP Child Fatty";
        src: url("./fonts/bpchildfatty.regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "DynaPuff", system-ui, sans-serif;
        font-weight: var(--w-regular);
      }

      body {
        background: var(--cream);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      /* ------ FONT WEIGHTS ONLY (clean + consistent) ------ */
      .menu-btn {
        font-weight: var(--w-semibold);
      }
      .focus-tag {
        font-weight: var(--w-medium);
      }
      .streak-badge,
      .user-name {
        font-weight: var(--w-semibold);
      }

      .user-avatar {
        font-weight: var(--w-bold);
      }

      .timer-text {
        font-weight: var(--w-semibold);
      }

      .action-btn,
      .resume-big,
      .end-big,
      .popup-btn,
      .popup-box h3,
      .picker-title,
      .picker-header button {
        font-weight: var(--w-bold);
      }

      .popup-box p,
      .wheel-item {
        font-weight: var(--w-regular);
      }

      .menu-title {
        font-weight: var(--w-black); /* keep boldest */
      }

      .menu-subtitle,
      .menu-footer {
        font-weight: var(--w-medium);
      }

      .menu-close {
        font-weight: var(--w-bold);
      }

      .menu-item,
      .wheel-label {
        font-weight: var(--w-medium);
      }

      /* --- PHONE FRAME --- */
      .phone-frame {
        width: 320px;
        height: 640px;
        background-color: var(--ink);
        border-radius: 36px;
        padding: 10px;
        position: relative;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      }
      .phone-notch {
        width: 130px;
        height: 22px;
        background: var(--ink);
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        border-bottom-left-radius: 18px;
        border-bottom-right-radius: 18px;
        z-index: 10;
      }

      .app-screen {
        width: 100%;
        height: 100%;
        background: var(--bg);
        border-radius: 28px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      /* --- HEADER --- */
      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 35px 20px 10px;
        gap: 10px;
      }

      .menu-btn {
        background: none;
        border: none;
        font-size: 22px;

        color: var(--ink);
        cursor: pointer;
        line-height: 1;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .streak-badge {
        background: rgba(var(--cream-rgb), 0.3);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 13px;

        color: var(--ink);
        display: flex;
        align-items: center;
        gap: 6px;
        border: 2px solid rgba(31, 31, 31, 0.08);
      }
      .streak-badge i {
        color: var(--accent);
      }

      .user-chip {
        background: rgba(var(--cream-rgb), 0.3);
        border: 2px solid rgba(31, 31, 31, 0.08);
        border-radius: 999px;
        padding: 6px 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .user-avatar {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--accent);
        display: grid;
        place-items: center;
        color: var(--ink);
        font-size: 12px;
      }
      .user-name {
        font-size: 12px;

        color: var(--ink);
        max-width: 96px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* --- TIMER CONTENT --- */
      .timer-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding-bottom: 20px;
      }

      .focus-tag {
        background: var(--accent);
        color: var(--ink);
        font-size: 13px;

        padding: 7px 16px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 18px;
        border: 2px solid rgba(31, 31, 31, 0.1);
      }

      .pet-wrapper {
        position: relative;
        width: 230px;
        height: 230px;
        margin-bottom: 20px;
      }

      .progress-ring {
        position: absolute;
        top: 0;
        left: 0;
        transform: rotate(-90deg);
      }
      .progress-ring__bg {
        fill: none;
        stroke: rgba(31, 31, 31, 0.08);
        stroke-width: 12;
      }
      .progress-ring__value {
        fill: none;
        stroke: var(--accent);
        stroke-width: 12;
        stroke-linecap: round;
        filter: drop-shadow(0 0 4px rgba(243, 176, 59, 0.35));
        stroke-dasharray: 0 999;
        transition: stroke-dashoffset 0.35s, stroke 0.3s;
      }

      .pet-circle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 170px;
        height: 170px;
        border-radius: 50%;
        background: rgba(var(--cream-rgb), 0.25);
        border: 7px solid rgba(31, 31, 31, 0.06);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: 0.3s;
      }

      @keyframes pulseGlow {
        0% {
          transform: translate(-50%, -50%) scale(1);
          box-shadow: 0 0 0 rgba(243, 176, 59, 0);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.03);
          box-shadow: 0 0 28px rgba(243, 176, 59, 0.35);
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
          box-shadow: 0 0 0 rgba(243, 176, 59, 0);
        }
      }

      .pet-circle.active {
        background: rgba(var(--cream-rgb), 0.42);
        animation: pulseGlow 1.2s ease-in-out infinite;
      }

      .pet-img {
        width: 130px;
        height: 130px;
        object-fit: contain;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
      }

      .timer-text {
        font-size: 52px;

        color: var(--ink);
        margin-bottom: 18px;
        letter-spacing: 1px;
        cursor: pointer;
        user-select: none;
      }

      .action-btn {
        width: 180px;
        padding: 15px;
        border: none;
        border-radius: 28px;
        font-size: 16px;

        cursor: pointer;
        transition: 0.15s;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.12);
      }
      .btn-start {
        background: var(--accent);
        color: var(--ink);
      }
      .btn-giveup {
        background: var(--danger);
        color: #fff;
      }

      #resumeEndRow {
        display: none;
        flex-direction: row;
        justify-content: center;
        gap: 10px;
        margin-top: 12px;
        width: 210px;
      }

      .resume-big,
      .end-big {
        flex: 1;
        padding: 14px;
        border-radius: 24px;
        font-size: 16px;

        border: none;
        cursor: pointer;
      }
      .resume-big {
        background: rgba(var(--cream-rgb), 0.7);
        color: var(--ink);
        border: 2px solid rgba(31, 31, 31, 0.08);
      }
      .end-big {
        background: var(--danger);
        color: white;
      }

      /* --- POPUP STYLES --- */
      .popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(31, 31, 31, 0.35);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
      }
      .popup-box {
        background: var(--bg);
        border-radius: 22px;
        width: 280px;
        padding: 22px;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.22);
        animation: scalePop 0.25s;
        border: 2px solid rgba(31, 31, 31, 0.08);
      }
      @keyframes scalePop {
        from {
          transform: scale(0.8);
        }
        to {
          transform: scale(1);
        }
      }

      .popup-box h3 {
        font-size: 19px;

        color: var(--ink);
        margin-bottom: 8px;
      }
      .popup-box p {
        font-size: 13px;
        color: rgba(31, 31, 31, 0.75);
        margin-bottom: 18px;
      }

      .popup-actions {
        display: flex;
        gap: 10px;
      }
      .popup-btn {
        flex: 1;
        padding: 11px;
        border-radius: 14px;
        border: none;

        font-size: 14px;
        cursor: pointer;
      }
      .popup-yes {
        background: var(--accent);
        color: var(--ink);
      }
      .popup-no {
        background: rgba(var(--cream-rgb), 0.35);
        color: var(--ink);
      }

      /* --- MENU DRAWER --- */
      .menu-drawer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
      }
      .menu-drawer-overlay {
        position: absolute;
        inset: 0;
        background: rgba(31, 31, 31, 0.18);
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .menu-panel {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 220px;
        background: var(--bg);
        box-shadow: 6px 0 18px rgba(0, 0, 0, 0.25);
        border-radius: 28px 0 0 28px;
        transform: translateX(-110%);
        transition: transform 0.2s ease-out;
        display: flex;
        flex-direction: column;
        padding: 28px 18px 18px;
        border-right: 2px solid rgba(31, 31, 31, 0.08);
      }
      .menu-drawer.open {
        pointer-events: auto;
      }
      .menu-drawer.open .menu-drawer-overlay {
        opacity: 1;
      }
      .menu-drawer.open .menu-panel {
        transform: translateX(0);
      }

      .menu-title {
        font-family: "BP Child Fatty", "Nunito", sans-serif;
        font-size: 26px;

        color: var(--ink);
        letter-spacing: 2px;
        margin-bottom: 6px;
      }
      .menu-subtitle {
        font-size: 11px;
        color: rgba(31, 31, 31, 0.6);
        margin-bottom: 18px;
      }
      .menu-close {
        align-self: flex-end;
        background: none;
        border: none;
        font-size: 18px;

        color: var(--ink);
        cursor: pointer;
        margin-bottom: 8px;
      }
      .menu-items {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .menu-item {
        width: 100%;
        text-align: left;
        border: 2px solid rgba(31, 31, 31, 0.08);
        border-radius: 14px;
        padding: 10px 12px;
        font-size: 13px;

        cursor: pointer;
        background: rgba(var(--cream-rgb), 0.25);
        color: var(--ink);
      }
      .menu-item.primary {
        background: var(--accent);
        color: var(--ink);
      }
      .menu-item:hover {
        background: var(--accent);
      }
      .menu-item.logout {
        background: rgba(243, 84, 59, 0.16);
        border-color: rgba(243, 84, 59, 0.35);
      }
      .menu-item.logout:hover {
        background: var(--danger);
        color: #fff;
      }
      .menu-footer {
        margin-top: auto;
        font-size: 10px;
        color: rgba(31, 31, 31, 0.45);
      }

      /* --- PICKER --- */
      .picker-overlay {
        position: absolute;
        inset: 0;
        display: none;
        z-index: 200;
      }
      .picker-overlay.open {
        display: block;
      }

      .picker-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(31, 31, 31, 0.25);
      }

      .picker-sheet {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 14px;

        background: rgba(var(--cream-rgb), 0.92);
        backdrop-filter: blur(14px);

        border-radius: 22px;
        padding-bottom: 12px;

        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
        border: 2px solid rgba(31, 31, 31, 0.08);
      }

      .picker-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(31, 31, 31, 0.08);
      }

      .picker-header button {
        background: none;
        border: none;
        font-size: 15px;

        cursor: pointer;
      }

      #pickerCancel {
        color: rgba(31, 31, 31, 0.55);
      }
      #pickerSave {
        color: var(--accent);
      }

      .picker-title {
        color: var(--ink);
        font-size: 15px;
      }

      .picker-body {
        position: relative;
        height: 170px;
        padding: 10px 6px 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .wheel-col {
        position: relative;
        height: 150px;
        overflow: hidden;
        border-radius: 14px;
        background: transparent;
      }

      .wheel-scroll {
        height: 150px;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
        padding: 57px 0;
      }

      .wheel-item {
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;

        scroll-snap-align: center;
        font-size: 20px;

        color: rgba(31, 31, 31, 0.35);
        user-select: none;
      }

      .wheel-item.selected {
        color: var(--ink);
      }

      .wheel-highlight {
        position: absolute;
        left: 6px;
        right: 6px;
        top: 57px;
        height: 36px;
        border-radius: 12px;

        background: rgba(31, 31, 31, 0.06);
        border: 1px solid rgba(31, 31, 31, 0.08);
        pointer-events: none;
      }

      .wheel-label {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 11px;

        letter-spacing: 1px;
        color: rgba(31, 31, 31, 0.35);
        pointer-events: none;
      }
      .wheel-scroll {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .wheel-scroll::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }
      .wheel-col::before,
      .wheel-col::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 44px;
        pointer-events: none;
        z-index: 2;
      }
      .wheel-col::before {
        top: 0;
        background: linear-gradient(
          to bottom,
          rgba(var(--cream-rgb), 0.95),
          rgba(var(--cream-rgb), 0)
        );
      }
      .wheel-col::after {
        bottom: 0;
        background: linear-gradient(
          to top,
          rgba(var(--cream-rgb), 0.95),
          rgba(var(--cream-rgb), 0)
        );
      }
    </style>
  </head>

  <body>
    <div class="phone-frame">
      <div class="phone-notch"></div>

      <div class="app-screen" id="appScreen">
        <div class="header-row">
          <button class="menu-btn" id="menuBtn">☰</button>

          <div class="header-right">
            <div class="streak-badge" id="streakBadge">
              <i class="fa-solid fa-fire"></i>
              <span id="streakText">0</span>
            </div>

            <div class="user-chip" id="userChip" role="button" tabindex="0">
              <div class="user-avatar" id="userAvatar">
                <i class="fa-solid fa-user"></i>
              </div>
              <div class="user-name" id="userName">username</div>
            </div>
          </div>
        </div>

        <div class="menu-drawer" id="menuDrawer">
          <div class="menu-drawer-overlay" id="menuOverlay"></div>
          <div class="menu-panel">
            <button class="menu-close" id="menuClose">✕</button>
            <div class="menu-title">pet pact</div>
            <div class="menu-subtitle">Your focus, your pact</div>

            <div class="menu-items">
              <button class="menu-item primary" id="menuHome">
                Back to Home
              </button>
              <button class="menu-item" id="menuProfile">Profile</button>
              <button class="menu-item" id="menuCalendar">Calendar</button>
              <button class="menu-item" id="menuFriends">Friends</button>
              <button class="menu-item" id="menuShop">Pet Shop</button>
              <button class="menu-item" id="menuSettings">Settings</button>
              <button class="menu-item logout" id="menuLogout">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
              </button>
            </div>

            <div class="menu-footer">v0.1 • Focus & Break Companion</div>
          </div>
        </div>

        <div class="timer-content">
          <div class="focus-tag" id="modeTag">
            <i class="fa-solid fa-circle"></i> Study Mode
          </div>

          <div class="pet-wrapper">
            <svg
              class="progress-ring"
              width="230"
              height="230"
              viewBox="0 0 260 260"
            >
              <circle
                class="progress-ring__bg"
                cx="130"
                cy="130"
                r="100"
              ></circle>
              <circle
                class="progress-ring__value"
                cx="130"
                cy="130"
                r="100"
              ></circle>
            </svg>

            <div class="pet-circle" id="petCircle">
              <img id="petImg" class="pet-img" src="normal.png" alt="Pet" />
            </div>
          </div>

          <div class="timer-text" id="timeLeft" title="Tap to change time">
            25:00
          </div>

          <button id="timerBtn" class="action-btn btn-start">START</button>

          <div id="resumeEndRow">
            <button class="resume-big" id="resumeBtn">RESUME</button>
            <button class="end-big" id="endBtn">END</button>
          </div>
        </div>

        <div class="picker-overlay" id="timePicker">
          <div class="picker-backdrop" id="pickerBackdrop"></div>

          <div
            class="picker-sheet"
            role="dialog"
            aria-modal="true"
            aria-label="Set timer"
          >
            <div class="picker-header">
              <button id="pickerCancel">Cancel</button>
              <div class="picker-title">Set Timer</div>
              <button id="pickerSave">Save</button>
            </div>

            <div class="picker-body">
              <div class="wheel-col">
                <div class="wheel-highlight"></div>
                <div class="wheel-scroll" id="wheelHours"></div>
                <div class="wheel-label">hrs</div>
              </div>

              <div class="wheel-col">
                <div class="wheel-highlight"></div>
                <div class="wheel-scroll" id="wheelMins"></div>
                <div class="wheel-label">min</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* ---------- STORAGE KEYS ---------- */
      const TASK_NAME_KEY = "petpact_taskName";
      const TASK_MIN_KEY = "petpact_taskMinutes";
      const BREAK_MIN_KEY = "petpact_breakMinutes";
      const ACTIVE_CTX_KEY = "petpact_active_context";

      const TOTAL_MINUTES_KEY = "petpact_total_minutes";
      const SESSION_COUNT_KEY = "petpact_session_count";
      const BEST_STREAK_KEY = "petpact_best_streak";

      /* ---------- CORE DOM ---------- */
      const pet = document.getElementById("petCircle");
      const petImg = document.getElementById("petImg");
      const timerEl = document.getElementById("timeLeft");
      const btn = document.getElementById("timerBtn");
      const resumeRow = document.getElementById("resumeEndRow");
      const resumeBtn = document.getElementById("resumeBtn");
      const endBtn = document.getElementById("endBtn");
      const modeTag = document.getElementById("modeTag");
      const streakTextEl = document.getElementById("streakText");
      const progressCircle = document.querySelector(".progress-ring__value");

      // header user chip
      const userChip = document.getElementById("userChip");
      const userNameEl = document.getElementById("userName");

      /* ---------- STATS ---------- */
      let totalMinutes =
        parseInt(localStorage.getItem(TOTAL_MINUTES_KEY), 10) || 0;
      let sessionCount =
        parseInt(localStorage.getItem(SESSION_COUNT_KEY), 10) || 0;
      let bestStreak = parseInt(localStorage.getItem(BEST_STREAK_KEY), 10) || 0;

      /* ---------- ACTIVE CONTEXT HELPERS ---------- */
      function setActiveContext(ctx) {
        localStorage.setItem(ACTIVE_CTX_KEY, JSON.stringify(ctx));
      }
      function getActiveContext() {
        try {
          return JSON.parse(localStorage.getItem(ACTIVE_CTX_KEY) || "null");
        } catch {
          return null;
        }
      }

      function clearSessionLabelToStudyMode() {
        localStorage.removeItem(ACTIVE_CTX_KEY); // friend label
        localStorage.removeItem(TASK_NAME_KEY);
      }

      function renderModeTag() {
        const ctx = getActiveContext();
        const taskName = (localStorage.getItem(TASK_NAME_KEY) || "").trim();

        if (ctx && ctx.type === "friend" && ctx.label) {
          modeTag.innerHTML = `<i class="fa-solid fa-users"></i> ${ctx.label}`;
          return;
        }
        if (taskName) {
          modeTag.innerHTML = `<i class="fa-solid fa-circle"></i> ${taskName}`;
          return;
        }
        modeTag.innerHTML = `<i class="fa-solid fa-circle"></i> Study Mode`;
      }

      /* ---------- TIMER BASED ON TASK MINUTES ---------- */
      function readFocusTotalSeconds() {
        const storedTaskMinutesStr = localStorage.getItem(TASK_MIN_KEY);
        if (storedTaskMinutesStr) {
          const mins = parseInt(storedTaskMinutesStr, 10);
          if (!isNaN(mins) && mins > 0) return mins * 60;
        }
        return 25 * 60;
      }

      let focusTotal = readFocusTotalSeconds();

      let total = focusTotal;
      let remain = total;
      let timerRunning = false;
      let interval = null;

      let mode = "focus";
      let breakWarningShown = false;

      let streakCount = 0;
      let lockIdleFace = false;

      function setPetFace(name) {
        const safe = ["happy", "angry", "sad", "normal", "surprised"].includes(
          name
        )
          ? name
          : "normal";
        petImg.src = `${safe}.png`;
      }

      function refreshUsername() {
        const storedUsername = localStorage.getItem("petpact_username");
        const username =
          storedUsername && storedUsername.trim()
            ? storedUsername.trim()
            : "username";
        userNameEl.textContent = username;
      }

      function refreshIdlePet() {
        if (lockIdleFace) return;
        if (sessionCount === 0 || streakCount === 0) setPetFace("normal");
        else setPetFace("happy");
      }

      (function initHeaderUser() {
        refreshUsername();
      })();

      (function initStreak() {
        streakCount = 0;
        streakTextEl.textContent = String(streakCount);
        refreshIdlePet();
      })();

      /* ---------- PROGRESS RING ---------- */
      const radius = 100;
      const circumference = 2 * Math.PI * radius;
      progressCircle.style.strokeDasharray = `${circumference}`;
      progressCircle.style.strokeDashoffset = circumference;

      function setRing(percent) {
        const offset = circumference - (percent / 100) * circumference;
        progressCircle.style.strokeDashoffset = offset;
      }

      function updateTimeDisplay() {
        const m = Math.floor(remain / 60);
        const s = remain % 60;
        timerEl.textContent =
          String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");

        const progressPercent =
          total > 0 ? ((total - remain) / total) * 100 : 0;
        setRing(progressPercent);
      }

      /* ---------- POPUP ---------- */
      function ask(title, msg, yesFn, noFn) {
        const pop = document.createElement("div");
        pop.className = "popup-overlay";
        pop.innerHTML = `
      <div class="popup-box">
        <h3>${title}</h3>
        <p>${msg}</p>
        <div class="popup-actions">
          <button class="popup-btn popup-yes">YES</button>
          <button class="popup-btn popup-no">NO</button>
        </div>
      </div>
    `;
        document.body.appendChild(pop);

        pop.querySelector(".popup-no").onclick = () => {
          noFn && noFn();
          pop.remove();
        };
        pop.querySelector(".popup-yes").onclick = () => {
          yesFn && yesFn();
          pop.remove();
        };
        return pop;
      }

      /* ---------- RESET / STATE ---------- */
      function resetToFocusIdle() {
        mode = "focus";
        timerRunning = false;
        clearInterval(interval);

        focusTotal = readFocusTotalSeconds();
        total = focusTotal;
        remain = total;

        pet.classList.remove("active");
        progressCircle.style.stroke = getComputedStyle(
          document.documentElement
        ).getPropertyValue("--accent");

        setRing(0);
        updateTimeDisplay();

        btn.style.display = "block";
        btn.textContent = "START";
        btn.className = "action-btn btn-start";
        resumeRow.style.display = "none";

        refreshIdlePet();
        renderModeTag();
      }

      function getBreakLengthSeconds() {
        if (focusTotal < 5 * 60) return 1 * 60;
        if (focusTotal <= 25 * 60) return 5 * 60;
        return 20 * 60;
      }

      function tick() {
        remain--;

        if (remain <= 0) {
          if (mode === "focus") onFocusComplete();
          else if (mode === "break") onBreakComplete();
          return;
        }

        if (mode === "break") {
          if (!breakWarningShown && remain <= 30) {
            breakWarningShown = true;
            progressCircle.style.stroke = getComputedStyle(
              document.documentElement
            ).getPropertyValue("--danger");
            ask(
              "Break Ending Soon!",
              "Your break is about to end in 30 seconds. Get ready to focus again!",
              function () {}
            );
          }
        }

        updateTimeDisplay();
      }

      function startFocus() {
        mode = "focus";
        timerRunning = true;
        lockIdleFace = false;

        pet.classList.add("active");
        setPetFace("happy");

        progressCircle.style.stroke = getComputedStyle(
          document.documentElement
        ).getPropertyValue("--accent");

        btn.style.display = "block";
        resumeRow.style.display = "none";
        btn.textContent = "GIVE UP";
        btn.className = "action-btn btn-giveup";

        focusTotal = readFocusTotalSeconds();
        total = focusTotal;
        remain = total;

        setRing(0);
        updateTimeDisplay();

        renderModeTag();

        clearInterval(interval);
        interval = setInterval(tick, 1000);
      }

      function giveUp() {
        clearInterval(interval);
        timerRunning = false;

        pet.classList.remove("active");
        mode = "focus-paused";

        btn.style.display = "none";
        resumeRow.style.display = "flex";

        setPetFace("sad");
        lockIdleFace = true;
      }

      function resumeFocus() {
        mode = "focus";
        timerRunning = true;
        lockIdleFace = false;

        pet.classList.add("active");
        setPetFace("happy");

        btn.style.display = "block";
        resumeRow.style.display = "none";
        btn.textContent = "GIVE UP";
        btn.className = "action-btn btn-giveup";

        progressCircle.style.stroke = getComputedStyle(
          document.documentElement
        ).getPropertyValue("--accent");

        clearInterval(interval);
        interval = setInterval(tick, 1000);
      }

      function abortSession() {
        clearInterval(interval);
        timerRunning = false;

        pet.classList.remove("active");
        setPetFace("angry");
        lockIdleFace = true;

        clearSessionLabelToStudyMode();

        resetToFocusIdle();
      }

      function onFocusComplete() {
        clearInterval(interval);
        timerRunning = false;

        remain = 0;
        updateTimeDisplay();
        setRing(100);

        pet.classList.remove("active");
        setPetFace("happy");
        lockIdleFace = false;

        progressCircle.style.stroke = getComputedStyle(
          document.documentElement
        ).getPropertyValue("--accent");

        streakCount += 1;
        streakTextEl.textContent = String(streakCount);

        sessionCount += 1;
        totalMinutes += Math.round(focusTotal / 60);
        if (streakCount > bestStreak) bestStreak = streakCount;

        localStorage.setItem(TOTAL_MINUTES_KEY, String(totalMinutes));
        localStorage.setItem(SESSION_COUNT_KEY, String(sessionCount));
        localStorage.setItem(BEST_STREAK_KEY, String(bestStreak));

        mode = "break-ready";
        btn.style.display = "block";
        resumeRow.style.display = "none";
        btn.textContent = "START BREAK";
        btn.className = "action-btn btn-start";

        modeTag.innerHTML = `<i class="fa-solid fa-circle"></i> Break Ready`;
      }

      function startBreak() {
        mode = "break";
        timerRunning = true;
        breakWarningShown = false;

        const breakLen = getBreakLengthSeconds();
        total = breakLen;
        remain = breakLen;

        progressCircle.style.stroke = getComputedStyle(
          document.documentElement
        ).getPropertyValue("--accent");

        setRing(0);
        updateTimeDisplay();

        pet.classList.add("active");
        setPetFace("normal");
        lockIdleFace = false;

        btn.style.display = "block";
        btn.textContent = "END BREAK";
        btn.className = "action-btn btn-giveup";

        resumeRow.style.display = "none";
        modeTag.innerHTML = `<i class="fa-solid fa-circle"></i> Break Time`;

        clearInterval(interval);
        interval = setInterval(tick, 1000);
      }

      function finishBreakToStudyMode(happyOrAngry, reasonText) {
        clearInterval(interval);
        timerRunning = false;

        pet.classList.remove("active");
        setPetFace(happyOrAngry ? "happy" : "angry");
        lockIdleFace = !happyOrAngry;

        progressCircle.style.stroke = getComputedStyle(
          document.documentElement
        ).getPropertyValue("--accent");

        clearSessionLabelToStudyMode();

        mode = "focus";
        focusTotal = readFocusTotalSeconds();
        total = focusTotal;
        remain = total;

        setRing(0);
        updateTimeDisplay();

        btn.style.display = "block";
        btn.textContent = "START";
        btn.className = "action-btn btn-start";
        resumeRow.style.display = "none";

        if (!happyOrAngry && reasonText) {
          modeTag.innerHTML = `<i class="fa-solid fa-circle"></i> ${reasonText}`;
        } else {
          renderModeTag();
        }
      }

      function onBreakComplete() {
        remain = 0;
        updateTimeDisplay();
        setRing(100);

        const pop = ask(
          "Break Finished!",
          "Break is over. Tap YES to return to Study Mode.",
          function () {
            finishBreakToStudyMode(true);
          }
        );

        const timeoutMs = 8000;
        const t = setTimeout(() => {
          if (!document.body.contains(pop)) return;
          pop.remove();
          finishBreakToStudyMode(false, "You didn't come back in time");
        }, timeoutMs);

        pop.addEventListener("click", () => clearTimeout(t), { once: true });
      }

      /* ---------- BUTTON LOGIC ---------- */
      btn.onclick = () => {
        const text = btn.textContent;

        if (mode === "focus" && text === "START") {
          ask("Start Focus?", "Begin your focus session?", startFocus);
        } else if (mode === "focus" && text === "GIVE UP") {
          ask("Give Up?", "Stop your session now?", giveUp);
        } else if (mode === "break-ready" && text === "START BREAK") {
          ask(
            "Start Break?",
            "Start your break session based on your focus time?",
            startBreak
          );
        } else if (mode === "break" && text === "END BREAK") {
          ask("End Break?", "Finish your break and return to Study Mode?", () =>
            finishBreakToStudyMode(true)
          );
        }
      };

      resumeBtn.onclick = () =>
        ask("Resume?", "Continue where you left off?", resumeFocus);

      endBtn.onclick = () =>
        ask(
          "End Session?",
          "This will reset your session to Study Mode.",
          abortSession
        );

      /* ---------- USER CHIP NAV ---------- */
      function goProfile() {
        window.location.href = "profile.html";
      }
      userChip.addEventListener("click", goProfile);
      userChip.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          goProfile();
        }
      });

      /* =========================
     iOS WHEEL PICKER LOGIC
     ========================= */
      const picker = document.getElementById("timePicker");
      const pickerBackdrop = document.getElementById("pickerBackdrop");
      const pickerCancel = document.getElementById("pickerCancel");
      const pickerSave = document.getElementById("pickerSave");
      const wheelHours = document.getElementById("wheelHours");
      const wheelMins = document.getElementById("wheelMins");

      function buildWheel(el, values, formatFn) {
        el.innerHTML = "";
        values.forEach((v) => {
          const item = document.createElement("div");
          item.className = "wheel-item";
          item.dataset.value = String(v);
          item.textContent = formatFn ? formatFn(v) : String(v);
          el.appendChild(item);
        });
      }

      function snapAndSelect(el) {
        const items = Array.from(el.querySelectorAll(".wheel-item"));
        const centerY = el.scrollTop + el.clientHeight / 2;

        let best = null;
        let bestDist = Infinity;

        for (const it of items) {
          const itCenter = it.offsetTop + it.offsetHeight / 2;
          const d = Math.abs(itCenter - centerY);
          if (d < bestDist) {
            bestDist = d;
            best = it;
          }
        }
        if (!best) return;

        const targetTop =
          best.offsetTop - (el.clientHeight / 2 - best.offsetHeight / 2);
        el.scrollTo({ top: targetTop, behavior: "smooth" });

        items.forEach((x) => x.classList.remove("selected"));
        best.classList.add("selected");
      }

      function setWheelValue(el, value) {
        const it = el.querySelector(`.wheel-item[data-value="${value}"]`);
        if (!it) return;
        const targetTop =
          it.offsetTop - (el.clientHeight / 2 - it.offsetHeight / 2);
        el.scrollTop = targetTop;
        snapAndSelect(el);
      }

      function getWheelValue(el) {
        const items = Array.from(el.querySelectorAll(".wheel-item"));
        const centerY = el.scrollTop + el.clientHeight / 2;

        let best = items[0];
        let bestDist = Infinity;

        for (const it of items) {
          const itCenter = it.offsetTop + it.offsetHeight / 2;
          const d = Math.abs(itCenter - centerY);
          if (d < bestDist) {
            bestDist = d;
            best = it;
          }
        }
        return parseInt(best?.dataset?.value || "0", 10);
      }

      let hScrollT = null;
      let mScrollT = null;

      function attachWheel(el, which) {
        el.addEventListener("scroll", () => {
          if (which === "h") {
            clearTimeout(hScrollT);
            hScrollT = setTimeout(() => snapAndSelect(el), 80);
          } else {
            clearTimeout(mScrollT);
            mScrollT = setTimeout(() => snapAndSelect(el), 80);
          }
        });
      }

      buildWheel(wheelHours, [0, 1, 2, 3], (v) => String(v));
      buildWheel(
        wheelMins,
        Array.from({ length: 60 }, (_, i) => i),
        (v) => String(v).padStart(2, "0")
      );

      attachWheel(wheelHours, "h");
      attachWheel(wheelMins, "m");

      function openPicker() {
        const focusMins = Math.max(1, Math.round(readFocusTotalSeconds() / 60));
        const h = Math.floor(focusMins / 60);
        const m = focusMins % 60;

        picker.classList.add("open");
        setWheelValue(wheelHours, Math.min(3, Math.max(0, h)));
        setWheelValue(wheelMins, m);
      }

      function closePicker() {
        picker.classList.remove("open");
      }

      function applyNewFocusMinutes(mins) {
        const clamped = Math.max(1, Math.min(180, mins));
        localStorage.setItem(TASK_MIN_KEY, String(clamped));

        const newFocusTotal = clamped * 60;

        if (mode === "focus" || mode === "focus-paused") {
          const elapsed = total - remain;
          focusTotal = newFocusTotal;
          total = focusTotal;
          remain = Math.max(0, total - elapsed);

          setRing(0);
          updateTimeDisplay();

          if (remain <= 0 && mode === "focus") onFocusComplete();
          return;
        }

        if (mode === "break-ready") {
          focusTotal = newFocusTotal;
          total = focusTotal;
          remain = total;
          setRing(0);
          updateTimeDisplay();
          return;
        }

        focusTotal = newFocusTotal;
      }

      function canChangeTimerNow() {
        const focusRunning = mode === "focus" && timerRunning === true;
        const breakRunning = mode === "break" && timerRunning === true;
        return !(focusRunning || breakRunning);
      }

      timerEl.addEventListener("click", (e) => {
        if (!canChangeTimerNow()) {
          e.preventDefault();
          return;
        }
        openPicker();
      });

      pickerBackdrop.addEventListener("click", closePicker);
      pickerCancel.addEventListener("click", closePicker);

      pickerSave.addEventListener("click", () => {
        const h = getWheelValue(wheelHours);
        const m = getWheelValue(wheelMins);

        let mins = h * 60 + m;
        if (mins < 1) mins = 1;
        if (mins > 180) mins = 180;

        applyNewFocusMinutes(mins);
        closePicker();
      });

      /* ---------- MENU DRAWER LOGIC ---------- */
      const menuBtn = document.getElementById("menuBtn");
      const menuDrawer = document.getElementById("menuDrawer");
      const menuOverlay = document.getElementById("menuOverlay");
      const menuClose = document.getElementById("menuClose");
      const menuHome = document.getElementById("menuHome");
      const menuCalendar = document.getElementById("menuCalendar");
      const menuProfile = document.getElementById("menuProfile");
      const menuFriends = document.getElementById("menuFriends");
      const menuShop = document.getElementById("menuShop");
      const menuLogout = document.getElementById("menuLogout");

      function openMenu() {
        menuDrawer.classList.add("open");
      }
      function closeMenu() {
        menuDrawer.classList.remove("open");
      }

      menuBtn.addEventListener("click", openMenu);
      menuClose.addEventListener("click", closeMenu);
      menuOverlay.addEventListener("click", closeMenu);

      menuHome.addEventListener("click", () => closeMenu());
      menuCalendar.addEventListener(
        "click",
        () => (window.location.href = "calendar.html")
      );
      menuProfile.addEventListener(
        "click",
        () => (window.location.href = "profile.html")
      );
      menuFriends.addEventListener(
        "click",
        () => (window.location.href = "friends.html")
      );
      menuShop.addEventListener(
        "click",
        () => (window.location.href = "petshop.html")
      );

      menuLogout.addEventListener("click", () => {
        closeMenu();
        localStorage.removeItem("petpact_username");
        localStorage.removeItem(ACTIVE_CTX_KEY);
        localStorage.removeItem(TASK_NAME_KEY);
        localStorage.removeItem(TASK_MIN_KEY);
        window.location.href = "index.html";
      });

      /* ---------- KEEP UI FRESH ON RETURN ---------- */
      window.addEventListener("focus", () => {
        refreshUsername();

        renderModeTag();

        if (!timerRunning && (mode === "focus" || mode === "focus-paused")) {
          focusTotal = readFocusTotalSeconds();
          total = focusTotal;
          remain = total;
          setRing(0);
          updateTimeDisplay();
        }
      });

      /* ---------- INIT ---------- */
      renderModeTag();
      updateTimeDisplay();
      setRing(0);
    </script>
  </body>
</html>
