<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome - Pet Pact</title>

    <!-- Body font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* =========================
         THEME (same as login)
         - Whole background: #F4F3F1
         - Accent: #F3B03B (yellow)
         ========================= */
      :root {
        --bg: #f4f3f1; /* white-ish */
        --ink: #1f1f1f; /* black */
        --accent: #f3b03b; /* yellow */
        --cream: #ede3be; /* soft surface */
      }

      /* BP Child Fatty */
      @font-face {
        font-family: "BP Child Fatty";
        src: url("./fonts/bpchildfatty.regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "DynaPuff", system-ui, sans-serif;
        font-weight: 400;
      }

      /* Whole page background = your white */
      body {
        background-color: var(--cream);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      /* Phone frame */
      .phone-frame {
        width: 320px;
        height: 640px;
        background-color: var(--ink);
        border-radius: 36px;
        padding: 10px;
        position: relative;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      }

      .phone-notch {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 130px;
        height: 22px;
        background-color: var(--ink);
        border-bottom-left-radius: 18px;
        border-bottom-right-radius: 18px;
        z-index: 10;
      }

      /* Screen background = your white */
      .app-screen {
        width: 100%;
        height: 100%;
        background-color: var(--bg);
        border-radius: 28px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 30px 22px;
        text-align: center;
      }

      .logo-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 18px;
      }

      /* Yellow accent badge behind icon
         - removed border/ring
      */
      .logo-circle {
        width: auto;
        height: auto;
        background-color: transparent;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 16px;
        border: none; /* remove ring */
      }

      /* Icon size FIX: it must be smaller than the circle */
      .logo-img {
        width: 100px;
        height: 100px;
        object-fit: contain;
        display: block;
      }

      /* Same moving effect (pulse) */
      .pulse {
        animation: pulse 2.2s ease-in-out infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
        100% {
          transform: scale(1);
        }
      }

      .app-title {
        font-family: "BP Child Fatty", "Nunito", sans-serif;
        font-size: 28px;
        font-weight: 400;
        color: var(--ink);
        letter-spacing: 1px;
      }

      .welcome-text {
        font-size: 13px;
        color: rgba(31, 31, 31, 0.75);
        margin-top: 8px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* START BUTTON */
      .btn-start {
        margin-top: 36px;
        width: 200px;
        padding: 12px 0;
        border: none;
        border-radius: 14px;
        background-color: var(--ink);
        color: var(--accent);
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        box-shadow: 0 6px 10px rgba(0, 0, 0, 0.1);
        transition: transform 0.1s;
      }

      .btn-start:active {
        transform: scale(0.98);
      }

      .btn-start:focus {
        outline: none;
        box-shadow: 0 0 0 4px rgba(243, 176, 59, 0.22),
          0 6px 10px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>

  <body>
    <div class="phone-frame">
      <div class="phone-notch"></div>

      <div class="app-screen">
        <div class="logo-section">
          <div class="logo-circle pulse">
            <img class="logo-img" src="icon.png" alt="PetPact icon" />
          </div>

          <h1 class="app-title">pet pact</h1>
          <p class="welcome-text">Welcome to the pact!</p>
        </div>

        <button id="startBtn" class="btn-start">START</button>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("startBtn").addEventListener("click", () => {
          window.location.href = "main.html";
        });
      });
    </script>
  </body>
</html>
